const fq = n => 440 * 2 ** ((n - 69) / 12);

function ainit() {

  MB = A.createGain(); MB.gain.value = .5 * opt.mus; MB.connect(CM);
  SB = A.createGain(); SB.gain.value = opt.sfx; SB.connect(CM);
  const L = A.sampleRate * 2.4 | 0, ib = A.createBuffer(2, L, A.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < L; i++) d[i] = (R() * 2 - 1) * (1 - i / L) ** 3 }
  const cv = A.createConvolver(); cv.buffer = ib; RVB = A.createGain(); RVB.connect(cv);
  const rg = A.createGain(); rg.gain.value = .4; cv.connect(rg); rg.connect(CM);
  NB = A.createBuffer(1, A.sampleRate, A.sampleRate); const nd = NB.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  A.resume();
}
function applyVol() { if (!A) return; A.MG.gain.value = opt.mute ? 0 : opt.vol; MB.gain.value = .5 * opt.mus; SB.gain.value = opt.sfx }

// tono con envolvente. o: t(inicio) ty v s(glide) lp lp2 q a det rv(send reverb) bus
function tone(f, d, o = {}) {
  if (!A) return;
  const t0 = o.t || A.currentTime, os = A.createOscillator(), g = A.createGain();
  os.type = o.ty || 'square'; os.frequency.setValueAtTime(f, t0);
  if (o.s) os.frequency.exponentialRampToValueAtTime(max(20, f + o.s), t0 + d);
  if (o.det) os.detune.value = o.det;
  let n = os;
  if (o.lp) { const fl = A.createBiquadFilter(); fl.frequency.setValueAtTime(o.lp, t0); if (o.lp2) fl.frequency.exponentialRampToValueAtTime(o.lp2, t0 + d); fl.Q.value = o.q || 1; os.connect(fl); n = fl }
  const v = o.v ?? .1;
  g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + (o.a || .004)); g.gain.exponentialRampToValueAtTime(.0004, t0 + d);
  n.connect(g); g.connect(o.bus || SB);
  if (o.rv) { const s = A.createGain(); s.gain.value = o.rv; g.connect(s); s.connect(RVB) }
  os.start(t0); os.stop(t0 + d + .05);
}
// ruido filtrado. o: t v f(freq) ty(lowpass|highpass|bandpass) f2(freq final) q rv bus
function nse(d, o = {}) {
  if (!A) return;
  const t0 = o.t || A.currentTime, s = A.createBufferSource(), fl = A.createBiquadFilter(), g = A.createGain();
  s.buffer = NB; fl.type = o.ty || 'lowpass'; fl.frequency.setValueAtTime(o.f || 3000, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d); fl.Q.value = o.q || 1;
  g.gain.setValueAtTime(o.v ?? .2, t0); g.gain.exponentialRampToValueAtTime(.0004, t0 + d);
  s.connect(fl); fl.connect(g); g.connect(o.bus || SB);
  if (o.rv) { const r = A.createGain(); r.gain.value = o.rv; g.connect(r); r.connect(RVB) }
  s.start(t0, R() * .4, d + .05);
}
// compatibilidad con el codigo original
function B(f, d, ty = 'square', v = .1, s = 0) { tone(f, d, { ty, v, s }) }
function N(d, v = .2) { nse(d, { v, f: 4000, f2: 300 }) }

// ---- percusion y voces de musica ----
const kick = (t, v = .6) => { tone(150, .22, { t, ty: 'sine', v, s: -110, bus: MB }); nse(.03, { t, v: v * .3, f: 5000, bus: MB }) };
const snare = (t, v = .3) => { nse(.18, { t, v, f: 1800, ty: 'bandpass', q: .8, bus: MB, rv: .3 }); tone(190, .09, { t, ty: 'triangle', v: v * .6, s: -60, bus: MB }) };
const hat = (t, v = .06, d = .04) => nse(d, { t, v, f: 8000, ty: 'highpass', bus: MB });
const timp = (t, v = .8) => { tone(90, .7, { t, ty: 'sine', v, s: -45, bus: MB, rv: .5 }); nse(.25, { t, v: v * .4, f: 400, bus: MB, rv: .5 }) };
const bass = (n, t, d, v = .16, lp = 700) => tone(fq(n), d, { t, ty: 'sawtooth', v, lp, lp2: 120, q: 4, bus: MB });
const pad = (n, t, d, v = .04, lp = 1400) => { for (const k of [-9, 9]) tone(fq(n), d, { t, ty: 'sawtooth', v, det: k, lp, a: d * .4, bus: MB, rv: .6 }) };
const lead = (n, t, d, v = .06, ty = 'square') => tone(fq(n), d, { t, ty, v, lp: 3200, lp2: 900, bus: MB, rv: .35 });
const marimba = (n, t, v = .12) => { tone(fq(n), .35, { t, ty: 'triangle', v, bus: MB, rv: .3 }); tone(fq(n) * 4, .08, { t, ty: 'sine', v: v * .5, bus: MB }) };

// ---- pistas: f(paso, tiempo, duracion_de_paso). 16 pasos por compas ----

    const b = s % 16, bar = s >> 4 & 3, r = [45, 45, 41, 43][bar];

  // cinematica: lenta y epica. Intensidad crece con ct

    if (k > .6 && b % 2 == 0) lead(r + 24 + [0, 3, 7, 12][b >> 1 & 3], t, d * 1.5, .04, 'sawtooth');

  } },
  // fase 3: locura. Sirena, bombo doble, melodia distorsionada
  b3: { bpm: 152, f(s, t, d) {
    const b = s % 16, bar = s >> 4 & 3, r = [38, 37, 41, 36][bar];

    if (b == 4 || b == 12 || b == 15) snare(t, .35);
    hat(t, .06, .03);
    bass(r - 12 + (b % 8 == 6 ? 7 : 0), t, d * 1.1, .2, 1800);

  } },

  g: { bpm: 100, f(s, t, d) {
    const b = s % 16, bar = s >> 4 & 3, r = [48, 53, 55, 48][bar];
    if (b % 8 == 0) bass(r - 12, t, d * 3, .2, 500);
    if (b % 8 == 4) bass(r - 5, t, d * 2, .16, 500);
    if (b % 4 == 2) nse(.05, { t, v: .06, f: 6000, ty: 'highpass', bus: MB });
    if (b % 4 == 0) nse(.03, { t, v: .05, f: 900, bus: MB });
    if ([0, 3, 6, 8, 11, 14].includes(b)) marimba(r + 12 + [0, 4, 7, 9, 12, 7][([0, 3, 6, 8, 11, 14].indexOf(b) + bar) % 6], t);
  } },
};
const pistas = () => S == 'arena' ? 'b' + (bo ? bo.ph : 1) : S == 'cine' ? 'c' : S == 'god' ? 'g' : (S == 'win' || S == 'dead' || S == 'pause') ? '' : 'o';
function mus(dt) {
  if (!A || !opt.mus) return;
  const k = pistas();
  if (k != mtrack) { mtrack = k; mstep = 0; mnext = A.currentTime + .08 }
  const T = TR[k]; if (!T) return;
  const sd = 60 / T.bpm / 4;
  if (mnext < A.currentTime - .5) mnext = A.currentTime;
  while (mnext < A.currentTime + .25) { T.f(mstep, mnext, sd); mstep++; mnext += sd }
}

function sfxShot(w) {
  const x = [

  ][w]; x && x();

// ---- "voz" de Altman: sin sintesis de voz, solo blips graves tipo dialogo de juego retro ----
function speak(s) {
  if (!A || !opt.voz || opt.mute) return;
  const n = Math.min(14, 3 + (s.length / 5 | 0)), t0 = A.currentTime;
  for (let i = 0; i < n; i++) tone(95 + R() * 70 + (i % 3) * 25, .05, { t: t0 + i * .065, ty: 'sawtooth', v: .05, lp: 700 });
}

// ---- coherencia: resiste ensaladas de palabras y copy-paste ----
function coh(s,p){const n=' '+nz(s)+' ',ws=nz(s).match(/[a-z0-9]+/g)||[],nw=ws.length,N_=[];let c=0;
 const uq=new Set(ws).size,sw=ws.filter(w=>SW.has(w)).length,
 salad=p.c?!/[(){}[\]=:%]/.test(s):nw>=5&&(sw/nw<.17||uq/nw<.65);
 const rel=min(1,p.k.filter(k=>n.includes(k)).length/min(2,p.k.length));c+=rel*(p.c?60:35);N_.push(rel>=.5?['+','Responde']:['-','No responde']);
 const ai=AI.filter(a=>n.includes(a));c+=salad?0:min(1,ai.length/2)*20;N_.push(ai.length&&!salad?['+','Jerga de IA']:['-','Sin jerga']);
 const ss=s.split(/[.!?¿\n]+/).filter(x=>x.trim().split(/\s+/).length>=4).length;if(!salad)c+=p.c?min(1,nw/8)*20:min(1,ss/2)*15+min(1,nw/22)*20
 if(salad){c=min(c,12);N_.push(['-','Ensalada de palabras'])}
 const tl_=TL.filter(x=>n.includes(x));if(tl_.length){c-=min(45,tl_.length*15);N_.push(['-','"'+tl_[0].trim()+'": muy humano'])}
 const bd_=p.bad.filter(x=>n.includes(x));if(bd_.length){c-=25;N_.push(['-','"'+bd_[0]+'": confunde'])}
 return{c:cl(round(c),0,100),n:N_}}
